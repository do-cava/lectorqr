<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lector QR - Extractor de Parámetros</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #38bdf8;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 250px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 2px solid #334155;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-laser {
      position: absolute;
      top: 50%;
      left: 10%;
      width: 80%;
      height: 2px;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: scan 2s infinite ease-in-out;
    }

    @keyframes scan {
      0%, 100% { top: 20%; }
      50% { top: 80%; }
    }

    .result-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: left;
      word-break: break-all;
      margin-bottom: 12px;
    }

    .result-label {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .result-text {
      font-size: 0.95rem;
      color: #38bdf8;
      min-height: 20px;
    }

    .extracted-text {
      font-size: 1rem;
      color: #4ade80;
      font-weight: bold;
      margin-top: 5px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-extract {
      background: #22c55e;
    }
    .btn-extract:hover {
      background: #16a34a;
    }

    .btn-download {
      background: #0284c7;
    }
    .btn-download:hover {
      background: #0369a1;
    }

    .btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .history-box {
      margin-top: 15px;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      max-height: 120px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.85rem;
    }

    .history-item {
      padding: 4px 0;
      border-bottom: 1px solid #1e293b;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔍 Extractor de Parámetros QR</h1>
    
    <div class="video-container">
      <video id="video" playsinline></video>
      <div class="scanner-laser"></div>
    </div>

    <div class="result-box">
      <div class="result-label">QR Detectado:</div>
      <div id="rawResult" class="result-text">Apunte a un código QR...</div>
      
      <div class="result-label" style="margin-top:8px;">Texto extraído (tras '?'):</div>
      <div id="extractedResult" class="extracted-text">Ninguno</div>
    </div>

    <div class="btn-group">
      <button id="saveBtn" class="btn btn-extract" onclick="saveExtractedData()" disabled>Guardar parámetro extraído</button>
      <button id="downloadBtn" class="btn btn-download" onclick="downloadCSV()" disabled>Descargar historial (CSV)</button>
    </div>

    <div class="history-box" id="historyBox">
      <div class="result-label">Historial de guardados (0):</div>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>

    const canvasElement = document.getElementById('canvas');
    const canvas = canvasElement.getContext('2d');

    const saveBtn = document.getElementById('saveBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const historyBox = document.getElementById('historyBox');

    let currentExtractedData = "";
